name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests and typecheck
        run: |
          npm run lint
          npm test

      - name: Build static bundle
        env:
          VITE_BASE_PATH: "./"
        run: npm run build

      - name: Verify zero runtime AI keys in dist
        run: |
          test -f dist/index.html
          if grep -rnE "GEMINI_API_KEY|@google/genai|generativelanguage\.googleapis\.com" dist; then
            echo "ERROR: Forbidden runtime AI dependency or API key found in dist!"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
